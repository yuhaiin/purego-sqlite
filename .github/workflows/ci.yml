name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: driver-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
      - run: test -z "$(gofmt -l .)"
      - name: Verify benchmark report baselines
        run: python3 -m unittest discover -s benchmarks -p 'test_compare.py'
      - run: go vet ./...
        env:
          CGO_ENABLED: '0'
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
        env:
          CGO_ENABLED: '0'
      - run: go test ./...
        env:
          CGO_ENABLED: '0'
      - name: Verify production dependency graph has no CgoFiles
        run: test -z "$(CGO_ENABLED=0 go list -deps -f '{{if .CgoFiles}}{{.ImportPath}}{{end}}' ./...)"
      - name: Verify backend build-tag selection
        run: |
          python3 scripts/check-backends.py
          CGO_ENABLED=0 go test -tags sqlite_cgo ./internal/loader
      - name: Verify generated CGO bridges
        run: |
          go generate ./...
          git diff --exit-code
      - name: CGO static analysis
        run: |
          CGO_ENABLED=1 go vet -tags sqlite_cgo ./...
          CGO_ENABLED=1 go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 -tags sqlite_cgo ./...
      - name: Minimum Go version
        run: GOTOOLCHAIN=go1.26.0 CGO_ENABLED=0 go test ./...

  native:
    name: native (${{ matrix.os }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
            race: true
          - os: ubuntu-24.04-arm
            arch: arm64
            race: true
          - os: macos-15-intel
            arch: amd64
            race: true
          - os: macos-15
            arch: arm64
            race: true
          - os: windows-2025
            arch: amd64
            race: false
          - os: windows-11-arm
            arch: arm64
            race: false
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '0'
      SQLITE_REQUIRE_FEATURES: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.arch }}
      - name: Build pinned native library and local test extension
        run: go run ./internal/cmd/build-native --embed
      - name: Select absolute native paths
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          from pathlib import Path
          import platform
          p = Path('.native').resolve()
          library = {'Linux':'libsqlite3.so','Darwin':'libsqlite3.dylib','Windows':'sqlite3.dll'}[platform.system()]
          extension = 'test_extension.dll' if platform.system() == 'Windows' else 'test_extension.so'
          print('SQLITE_TEST_LIBRARY=' + str(p/library))
          print('SQLITE_TEST_EXTENSION=' + str(p/extension))
          PY
      - run: go test -v -timeout 3m ./...
      - run: go vet ./...
      - name: Race and native lifetime tests
        if: matrix.race
        env:
          CGO_ENABLED: '1'
        run: go test -race -tags sqlite_purego -timeout 3m ./...
      - name: CGO backend and strict pointer checks
        if: matrix.race
        env:
          CGO_ENABLED: '1'
          GOEXPERIMENT: cgocheck2
        run: go test -tags sqlite_cgo -race -timeout 3m ./...
      - name: Default linked CGO engine
        if: matrix.race
        env:
          CGO_ENABLED: '1'
          SQLITE_TEST_LIBRARY: ''
        run: go test -race -timeout 3m ./...
      - name: Install Windows CGO compiler
        if: runner.os == 'Windows'
        run: python3 scripts/install-zig-windows.py
      - name: Windows CGO linked engine and explicit DLL
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: '1'
          GOEXPERIMENT: cgocheck2
        run: |
          if [ "${{ matrix.arch }}" = arm64 ]; then
            export CC='zig cc -target aarch64-windows-gnu'
          else
            export CC='zig cc -target x86_64-windows-gnu'
          fi
          go test -timeout 3m ./...
          SQLITE_TEST_LIBRARY='' go test -timeout 3m ./...
      - name: Embedded library with CGO disabled
        env:
          SQLITE_TEST_BUNDLED: '1'
          SQLITE_TEST_LIBRARY: ''
        run: go test -tags sqlite_bundle -timeout 3m ./...
      - name: Optional row reader, scalar executor and standard-API fallback
        env:
          SQLITE_TEST_ROW_BRIDGE: '1'
          SQLITE_TEST_EXEC_BRIDGE: '1'
        run: |
          go run ./internal/cmd/build-native --row-bridge --exec-bridge --output .native/row-bridge
          export SQLITE_TEST_LIBRARY="$(python3 -c 'from pathlib import Path; import platform; print((Path(".native/row-bridge") / {"Linux":"libsqlite3.so","Darwin":"libsqlite3.dylib","Windows":"sqlite3.dll"}[platform.system()]).resolve())')"
          go test -gcflags=all=-d=checkptr=2 -timeout 3m ./...
          if [ "${{ matrix.race }}" = true ]; then
            CGO_ENABLED=1 GOEXPERIMENT=cgocheck2 go test -race -timeout 3m ./...
            CGO_ENABLED=1 go test -race -tags sqlite_purego -timeout 3m ./...
          elif [ "$RUNNER_OS" = Windows ]; then
            if [ "${{ matrix.arch }}" = arm64 ]; then
              export CC='zig cc -target aarch64-windows-gnu'
            else
              export CC='zig cc -target x86_64-windows-gnu'
            fi
            CGO_ENABLED=1 GOEXPERIMENT=cgocheck2 go test -timeout 3m ./...
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: native-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            .native/manifest.json
            internal/native/asset_*.go
            internal/native/assets/*

  benchmarks:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
          cache-dependency-path: benchmarks/go.sum
      - run: go run ./internal/cmd/build-native
      - name: PureGo, static and dynamic CGO, mattn and modernc comparisons
        run: |
          scripts/benchmark.sh -benchtime=1x -count=1
          cp benchmarks/results/local-raw.txt benchmarks/results/local-purego.txt
          BENCH_BACKEND=cgo scripts/benchmark.sh -benchtime=1x -count=1
          cp benchmarks/results/local-raw.txt benchmarks/results/local-cgo.txt
          BENCH_BACKEND=cgo-dynamic scripts/benchmark.sh -benchtime=1x -count=1
          cp benchmarks/results/local-raw.txt benchmarks/results/local-cgo-dynamic.txt
          python3 benchmarks/compare.py purego=benchmarks/results/local-purego.txt cgo=benchmarks/results/local-cgo.txt cgo-dynamic=benchmarks/results/local-cgo-dynamic.txt > benchmarks/results/local-five-way.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: benchmark-smoke
          path: |
            benchmarks/results/local-*
            .native/manifest.json

  mipsle:
    name: CGO Linux mipsle (QEMU)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
      - run: sudo apt-get update && sudo apt-get install -y gcc-mipsel-linux-gnu libc6-dev-mipsel-cross qemu-user
      - run: scripts/test-mipsle.sh

  freebsd:
    name: CGO and PureGo FreeBSD amd64
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Start FreeBSD VM
        uses: cross-platform-actions/action@82668f1fbd89d9c99487604f822cbf6716f124d3 # v1.7.0
        with:
          operating_system: freebsd
          version: '14.3'
      - name: Native CGO, features, extensions, race and embedded library
        shell: cpa.sh {0}
        run: |
          set -eu
          sudo pkg install -y ca_root_nss sqlite3
          fetch -o /tmp/sqlite-test-go.tar.gz https://go.dev/dl/go1.27.3.freebsd-amd64.tar.gz
          test "$(sha256 -q /tmp/sqlite-test-go.tar.gz)" = c15c88d07d6b2d2db5df7b65d9b9c73d631ac4e787da04e2bef2a5b6952c2cbb
          tar -C /tmp -xzf /tmp/sqlite-test-go.tar.gz
          export PATH="/tmp/go/bin:$PATH"
          export CGO_ENABLED=1
          go test -timeout 3m ./...
          go run ./internal/cmd/build-native --embed
          export SQLITE_TEST_LIBRARY="$PWD/.native/libsqlite3.so"
          export SQLITE_TEST_EXTENSION="$PWD/.native/test_extension.so"
          export SQLITE_REQUIRE_FEATURES=1
          go test -race -timeout 3m ./...
          go vet ./...
          CGO_ENABLED=0 go test -gcflags=github.com/ebitengine/purego/internal/fakecgo=-std -timeout 3m ./...
          SQLITE_TEST_LIBRARY='' SQLITE_TEST_BUNDLED=1 go test -tags sqlite_bundle -timeout 3m ./...

  alpine-static:
    name: Static CGO Alpine (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build and run a fully static musl executable
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.23 sh -ec '
            apk add --no-cache go gcc musl-dev binutils ripgrep bash
            export GOTOOLCHAIN=go1.27.3 CC=gcc
            bash scripts/test-static.sh
          '
      - name: Run without any libc, loader or SQLite installation
        run: |
          docker build -t sqlite-static-test -f - .native/static <<'DOCKERFILE'
          FROM scratch
          COPY driver.test /driver.test
          ENTRYPOINT ["/driver.test"]
          DOCKERFILE
          docker run --rm --network none --tmpfs /tmp:exec,mode=1777 -e SQLITE_REQUIRE_FEATURES=1 sqlite-static-test -test.v -test.timeout=3m

  android:
    name: CGO Android ${{ matrix.arch }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: arm64, triple: aarch64-linux-android}
          - {arch: amd64, triple: x86_64-linux-android}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
      - name: Cross-compile the complete test suite against the NDK
        env:
          GOOS: android
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '1'
          NDK_TRIPLE: ${{ matrix.triple }}
        run: |
          export CC="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/${NDK_TRIPLE}24-clang"
          go test -c -o android.test .
          readelf -d android.test > android-dependencies.txt
          cat android-dependencies.txt
          if grep -Eq 'NEEDED.*(sqlite|pthread)' android-dependencies.txt; then
            echo 'SQLite must be linked into the executable; Android threads use libc' >&2
            exit 1
          fi
